[pytest]
minversion = 9.0
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
markers =
    unit: fast isolated unit tests
    integration: cross-module decision-engine tests
    api: FastAPI endpoint tests
    dataset: knowledge-base and dataset validation tests
    regression: deterministic regression/golden-output tests
    edge: edge-case and boundary tests