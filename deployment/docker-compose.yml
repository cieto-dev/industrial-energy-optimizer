services:
  # ---------------------------------------------------------------
  # PostgreSQL database
  # ---------------------------------------------------------------
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    container_name: ieto-postgres
    restart: always
    environment:
      POSTGRES_USER: optimizer_user
      POSTGRES_PASSWORD: CHANGE_ME_PASSWORD
      POSTGRES_DB: industrial_energy_optimizer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimizer_user -d industrial_energy_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ieto-backend
    restart: always
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgresql://optimizer_user:CHANGE_ME_PASSWORD@postgres:5432/industrial_energy_optimizer
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  # ---------------------------------------------------------------
  # Next.js frontend
  # ---------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployment/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    container_name: ieto-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - "3000"

  # ---------------------------------------------------------------
  # Nginx reverse proxy
  #   /api/*  → backend:8000
  #   /*      → frontend:3000
  # ---------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: ieto-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
